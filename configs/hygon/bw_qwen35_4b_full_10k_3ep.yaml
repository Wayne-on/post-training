experiment:
  name: bw-qwen35-4b-full-10k-3ep
  purpose: eight-device ZeRO-3 language-model-scope reproduction of the historical A800 4B Full run

comparison:
  baseline: a800-qwen35-4b-full-zero3-10k-3ep-2k
  baseline_framework: LLaMA-Factory
  classification: cross-framework language-model-scope platform-stack reproduction, not a hardware-only benchmark
  baseline_tokens_per_second_per_gpu: 84.77
  baseline_runtime_hours: 1.79
  baseline_peak_memory_gib: 20.04
  baseline_train_loss: 0.0562
  baseline_average_tokens_per_sample: 145.87
  baseline_total_parameters_approx: 4.660B
  baseline_trainable_parameters_approx: 4.206B
  parameter_scope_note: A800 composite total includes frozen non-language parameters; BW direct contains and trains the server-measured 4.205751296B language model only

runtime:
  transformers_version: 5.6.0
  minimum_peft_version: 0.18.0

model:
  name_or_path: /root/private_data/models/Qwen3.5-4B
  expected_model_class: Qwen3_5ForCausalLM
  trust_remote_code: false
  local_files_only: true
  use_fast_tokenizer: true
  attn_implementation: null
  torch_dtype: bfloat16

data:
  path: examples/datasets/customer_intent_sft_smoke.jsonl
  split: train
  expected_source_sample_count: 10000
  expected_sha256: e88f950159fb4bd35d5642aa2d0e0224f5f6ad794bb09530579191744a3ce687
  messages_field: messages
  prompt_field: prompt
  response_field: response
  max_samples: 10000
  sample_strategy: first
  sample_seed: 42
  max_seq_length: 2048
  train_on_prompt: false
  chat_template_kwargs:
    enable_thinking: false
  pad_to_multiple_of: 8
  load_from_cache_file: false

finetuning:
  method: full
  model_scope: all parameters in Qwen3_5ForCausalLM returned by Transformers AutoModelForCausalLM
  expected_total_parameters: 4205751296
  expected_trainable_parameters: 4205751296
  expected_frozen_parameters: 0
  expected_parameter_count_basis: BW server-measured Qwen3_5ForCausalLM text scope with tied embeddings; includes 4096 q_norm/k_norm parameters across eight full-attention layers; excludes the vision tower
  minimum_trainable_percent: 99.99
  fresh_reload_validation: true

training:
  output_dir: outputs/transformers-peft/bw-qwen35-4b/full/sft_customer_intent_10k_3ep_bs1_ga8_zero3
  expected_world_size: 8
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  logging_first_step: false
  logging_nan_inf_filter: true
  save_strategy: steps
  save_steps: 200
  save_total_limit: 1
  save_only_model: true
  require_safetensors: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: true
  bf16: true
  fp16: false
  optim: adamw_torch
  max_grad_norm: 1.0
  report_to: tensorboard
  dataloader_num_workers: 4
  dataloader_drop_last: false
  ddp_find_unused_parameters: false
  ddp_backend: nccl
  ddp_timeout: 180000000
  deepspeed: configs/deepspeed/zero3_bf16.json
  expected_deepspeed_stage: 3
  seed: 42
  data_seed: 42

benchmark:
  require_gpu_utilization: true
  minimum_gpu_samples_per_device: 2
  minimum_gpu_utilization_mean_pct: 0.1
  gpu_monitor:
    command: auto
    parser: auto
    interval_seconds: 2.0
    timeout_seconds: 5.0
