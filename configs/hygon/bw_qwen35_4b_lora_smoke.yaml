experiment:
  name: bw-qwen35-4b-peft-lora-smoke-256
  purpose: single-device functional and measured-throughput smoke test

runtime:
  transformers_version: 5.6.0
  minimum_peft_version: 0.18.0

model:
  name_or_path: /root/private_data/models/Qwen3.5-4B
  expected_model_class: Qwen3_5ForCausalLM
  trust_remote_code: false
  local_files_only: true
  use_fast_tokenizer: true
  attn_implementation: eager
  torch_dtype: bfloat16

data:
  path: examples/datasets/customer_intent_sft_smoke.jsonl
  split: train
  expected_source_sample_count: 10000
  expected_sha256: e88f950159fb4bd35d5642aa2d0e0224f5f6ad794bb09530579191744a3ce687
  messages_field: messages
  prompt_field: prompt
  response_field: response
  max_samples: 256
  sample_strategy: shuffle
  sample_seed: 42
  max_seq_length: 512
  train_on_prompt: false
  chat_template_kwargs:
    enable_thinking: false
  pad_to_multiple_of: 8
  load_from_cache_file: false

finetuning:
  method: lora
  model_scope: Qwen3_5ForCausalLM returned by Transformers AutoModelForCausalLM

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - out_proj
    - in_proj_qkv
    - in_proj_z
    - in_proj_b
    - in_proj_a
  expected_trainable_parameters: 32464896
  expected_lora_module_count: 248
  expected_adapter_tensor_count: 496
  expected_adapter_key_prefix: base_model.model.model.

training:
  output_dir: outputs/transformers-peft/bw-qwen35-4b/lora/sft_customer_intent_smoke_256_1ep_bs1_ga8
  expected_world_size: 1
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 1
  save_strategy: "no"
  gradient_checkpointing: false
  bf16: true
  fp16: false
  optim: adamw_torch
  max_grad_norm: 1.0
  report_to: none
  dataloader_num_workers: 0
  dataloader_drop_last: false
  ddp_find_unused_parameters: false
  deepspeed: null
  seed: 42
  data_seed: 42

benchmark:
  require_gpu_utilization: true
  minimum_gpu_samples_per_device: 2
  gpu_monitor:
    command: auto
    parser: auto
    interval_seconds: 2.0
    timeout_seconds: 5.0
